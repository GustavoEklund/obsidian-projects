name: CI

# Every job is a quality gate. The last one, "All gates", succeeds only when all the others do: make that the single
# required status check in the branch protection rules.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # weekly: new advisories or tool releases can break a build that did not change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (Oxlint)
        run: npm run lint
      - name: Formatting (Oxfmt)
        run: npm run format:check
      - name: Types
        run: npm run typecheck
      - name: Source and docs are in English
        run: npm run check:language
      - name: Documentation (links, paths, scripts, CLI commands, CHANGELOG, workflows)
        run: npm run check:docs
      - name: Every version in the repo agrees
        run: npm run version:check
      - name: The conformance corpus is up to date (the Rust server is tested against it)
        run: npm run conformance:check

  unit:
    name: Unit tests, Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Fails when coverage drops below the thresholds in vitest.config.mts.
      - name: Tests and coverage
        run: npm run test:coverage
      - name: Coverage in the job summary
        if: matrix.node == 22
        run: npx tsx scripts/quality/coverage-summary.ts >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build, artifacts and browser UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Artifact gate (size budgets, no Node modules in the plugin, license notices, loads)
        run: npm run check:bundle
      - name: Smoke test of the built CLI
        run: npm run test:smoke
      # Chrome is preinstalled on the runner.
      - name: Browser UI tests
        run: npm run test:ui

  obsidian:
    name: End-to-end in the real Obsidian
    runs-on: ubuntu-latest
    env:
      OBSIDIAN_VERSION: '1.14.4' # the version the suite is verified against; bump it on purpose
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Download Obsidian
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/obsidian"
          gh release download "v$OBSIDIAN_VERSION" --repo obsidianmd/obsidian-releases --pattern "obsidian-$OBSIDIAN_VERSION.tar.gz" --dir "$RUNNER_TEMP/obsidian"
          tar -xzf "$RUNNER_TEMP/obsidian/obsidian-$OBSIDIAN_VERSION.tar.gz" -C "$RUNNER_TEMP/obsidian"
      # Runs the real app headless, with a throwaway profile and vault (see scripts/e2e-obsidian.mjs).
      - name: Run the suite
        run: npm run test:obsidian
        env:
          OBSIDIAN: ${{ runner.temp }}/obsidian/obsidian-${{ env.OBSIDIAN_VERSION }}/obsidian

  mcp:
    name: Rust MCP server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # One source of truth for the version: .tool-versions, which asdf reads locally.
      - name: Rust toolchain
        run: |
          version=$(awk '$1 == "rust" { print $2 }' .tool-versions)
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
          rustup default "$version"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/mcp/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/mcp/Cargo.lock', '.tool-versions') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Formatting
        working-directory: packages/mcp
        run: cargo fmt --check
      - name: Lint
        working-directory: packages/mcp
        run: cargo clippy --all-targets --locked -- -D warnings
      # The server is all file-system work (atomic writes, watchers, trash): it is tested on every platform it ships for.
      - name: Tests (including the conformance corpus generated from the TypeScript core)
        working-directory: packages/mcp
        run: cargo test --locked
      - name: Release build
        if: runner.os == 'Linux'
        working-directory: packages/mcp
        run: cargo build --release --locked
      - uses: actions/setup-node@v7
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: npm
      - name: Install the dependencies of the process tests
        if: runner.os == 'Linux'
        run: npm ci
      # The release binary driven as a real process: the official SDK client judges the protocol, and the notes it writes
      # are read back by the TypeScript core (and the other way round).
      - name: Process tests against the release binary
        if: runner.os == 'Linux'
        run: npm run test:mcp-binary

  binaries:
    name: MCP binaries
    uses: ./.github/workflows/mcp-binaries.yml

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # What ships to users (the bundled runtime dependencies): any advisory fails the build.
      - name: Production dependencies
        run: npm run audit:deps
      # Development tools never ship: report their advisories without blocking.
      - name: Development dependencies (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  gate:
    name: All gates
    if: always()
    needs: [static, unit, build, obsidian, mcp, binaries, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Gate results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "A gate did not succeed."; exit 1; }
          done
