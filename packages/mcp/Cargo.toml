[package]
name = "oprojects-mcp"
version = "0.2.0"
edition = "2024"
description = "MCP server for Obsidian Projects: a small, fast, local server over the vault's card notes"
license = "Unlicense"
repository = "https://github.com/GustavoEklund/obsidian-projects"
publish = false

[lib]
name = "oprojects_mcp"
path = "src/lib.rs"

[[bin]]
name = "oprojects-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1.12.1"
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio", "server", "http1", "server-graceful"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
rmcp = { version = "3.5", features = ["server", "transport-io", "transport-streamable-http-server"] }
saphyr-parser = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2"
time = { version = "0.3.55", default-features = false, features = ["local-offset"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "net", "time", "sync", "signal", "io-util"] }
unicode-normalization = "0.1.25"

# The whole point of this server is a tiny memory footprint and instant startup, so the release build is tuned for both.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
proptest = "1.12.0"
rmcp = { version = "3.5", features = ["client", "server", "macros", "transport-io"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "macros", "io-util", "time", "sync"] }
